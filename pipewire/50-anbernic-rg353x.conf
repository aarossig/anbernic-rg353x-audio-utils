# PipeWire filter chain configuration for Anbernic RG353 series (RK3566 + RK817)
#
# Creates a calibrated virtual sink for the internal 20mm speaker:
# - 24 dB/octave 280 Hz 4th-order Linkwitz-Riley high-pass filter eliminates
#   mechanical cone bottoming and protects the miniature speaker suspension.
# - Maximally flat passband (0 dB) with zero resonant peaking.
# - Target routes directly to RK817 ALSA hardware playback sink.

context.modules = [
  # 1. Calibrated Internal Speaker Filter Sink (280 Hz 4th-order Linkwitz-Riley HPF)
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Internal Speaker"
      media.name       = "Internal Speaker"
      filter.graph = {
        nodes = [
          {
            type   = builtin
            name   = hp_l1
            label  = bq_highpass
            control = { "Freq" = 280.0 "Q" = 0.7071 }
          }
          {
            type   = builtin
            name   = hp_l2
            label  = bq_highpass
            control = { "Freq" = 280.0 "Q" = 0.7071 }
          }
          {
            type   = builtin
            name   = hp_r1
            label  = bq_highpass
            control = { "Freq" = 280.0 "Q" = 0.7071 }
          }
          {
            type   = builtin
            name   = hp_r2
            label  = bq_highpass
            control = { "Freq" = 280.0 "Q" = 0.7071 }
          }
        ]
        links = [
          { output = "hp_l1:Out" input = "hp_l2:In" }
          { output = "hp_r1:Out" input = "hp_r2:In" }
        ]
        inputs  = [ "hp_l1:In" "hp_r1:In" ]
        outputs = [ "hp_l2:Out" "hp_r2:Out" ]
      }
      capture.props = {
        node.name        = "sink.anbernic-speaker"
        media.class      = "Audio/Sink"
        priority.session = 1600
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
      playback.props = {
        node.name      = "playback.anbernic-speaker"
        node.target    = "alsa_output.platform-sound.stereo-fallback"
        node.passive   = true
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }

  # 2. Full-Range Headphones Sink (pass-through stereo)
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Headphones"
      media.name       = "Headphones"
      filter.graph = {
        nodes = [
          {
            type  = builtin
            name  = copy_fl
            label = copy
          }
          {
            type  = builtin
            name  = copy_fr
            label = copy
          }
        ]
        inputs  = [ "copy_fl:In" "copy_fr:In" ]
        outputs = [ "copy_fl:Out" "copy_fr:Out" ]
      }
      capture.props = {
        node.name        = "sink.anbernic-headphones"
        media.class      = "Audio/Sink"
        priority.session = 1600
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
      playback.props = {
        node.name      = "playback.anbernic-headphones"
        node.target    = "alsa_output.platform-sound.stereo-fallback"
        node.passive   = true
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
