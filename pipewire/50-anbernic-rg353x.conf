# PipeWire configuration for Anbernic RG353 series (RK3566 + RK817)
#
# 1. Prioritize internal RK817 audio over HDMI output.
# 2. Buffer headroom prevents underruns on low-latency playback.
# 3. 180 Hz high-pass filter with -6 dB gain for internal 20mm speaker to
#    eliminate mechanical popping and prevent hardware HPF overflow.
# 4. Headphone output routes to direct ALSA sink (full-range, unfiltered).

node.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.*"
      },
      {
        node.name = "~alsa_output.*rk817.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1500
        api.alsa.headroom = 1024
      }
    }
  }
]

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Internal Speaker (180Hz HPF)"
            media.name       = "Internal Speaker (180Hz HPF)"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = hpf_fl
                        label = bq_highpass
                        control = { "Freq" = 180.0 "Q" = 0.707 }
                    }
                    {
                        type  = builtin
                        name  = hpf_fr
                        label = bq_highpass
                        control = { "Freq" = 180.0 "Q" = 0.707 }
                    }
                    {
                        type  = builtin
                        name  = gain_fl
                        label = mixer
                        control = { "Gain 1" = 0.5012 }
                    }
                    {
                        type  = builtin
                        name  = gain_fr
                        label = mixer
                        control = { "Gain 1" = 0.5012 }
                    }
                ]
                links = [
                    { output = "hpf_fl:Out" input = "gain_fl:In 1" }
                    { output = "hpf_fr:Out" input = "gain_fr:In 1" }
                ]
                inputs  = [ "hpf_fl:In" "hpf_fr:In" ]
                outputs = [ "gain_fl:Out" "gain_fr:Out" ]
            }
            capture.props = {
                node.name         = "anbernic_speaker_sink"
                node.description  = "Internal Speaker (180Hz HPF)"
                media.class       = "Audio/Sink"
                audio.position    = [ FL FR ]
                priority.session  = 1600
            }
            playback.props = {
                node.name         = "anbernic_speaker_playback"
                node.passive      = true
                audio.position    = [ FL FR ]
                stream.dont-remix = true
                target.object     = "alsa_output.platform-sound.stereo-fallback"
            }
        }
    }
]
