# PipeWire filter chain configuration for Anbernic RG353 series (RK3566 + RK817)
#
# Creates a calibrated virtual sink for the internal 20mm speaker:
# - 24 dB/octave 200 Hz high-pass filter eliminates mechanical cone bottoming.
# - -2 dB linear attenuation prevents inter-sample clipping on 0 dBFS audio.
# - Target routes directly to RK817 ALSA hardware playback sink.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Internal Speaker"
      media.name       = "Internal Speaker"
      filter.graph = {
        nodes = [
          {
            type   = builtin
            name   = hp_l1
            label  = bq_highpass
            control = { "Freq" = 200.0 "Q" = 0.707 }
          }
          {
            type   = builtin
            name   = hp_l2
            label  = bq_highpass
            control = { "Freq" = 200.0 "Q" = 0.707 }
          }
          {
            type   = builtin
            name   = gain_l
            label  = linear
            control = { "Mult" = 0.7943 "Add" = 0.0 }
          }
          {
            type   = builtin
            name   = hp_r1
            label  = bq_highpass
            control = { "Freq" = 200.0 "Q" = 0.707 }
          }
          {
            type   = builtin
            name   = hp_r2
            label  = bq_highpass
            control = { "Freq" = 200.0 "Q" = 0.707 }
          }
          {
            type   = builtin
            name   = gain_r
            label  = linear
            control = { "Mult" = 0.7943 "Add" = 0.0 }
          }
        ]
        links = [
          { output = "hp_l1:Out" input = "hp_l2:In" }
          { output = "hp_l2:Out" input = "gain_l:In" }
          { output = "hp_r1:Out" input = "hp_r2:In" }
          { output = "hp_r2:Out" input = "gain_r:In" }
        ]
        inputs  = [ "hp_l1:In" "hp_r1:In" ]
        outputs = [ "gain_l:Out" "gain_r:Out" ]
      }
      capture.props = {
        node.name        = "sink.anbernic-speaker"
        media.class      = "Audio/Sink"
        priority.session = 1600
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
      playback.props = {
        node.name   = "playback.anbernic-speaker"
        node.target = "alsa_output.platform-sound.stereo-fallback"
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
