# WirePlumber configuration for Anbernic RG353 series (RK3566 + RK817)
#
# 1. Demote raw ALSA hardware sink so virtual sinks always take priority.
# 2. Buffer headroom prevents underruns on low-latency playback.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.*"
      },
      {
        node.name = "~alsa_output.*rk817.*"
      }
    ],
    actions = {
      update-props = {
        node.description = "Internal Audio Hardware"
        priority.session = 0
        api.alsa.headroom = 1024
      }
    }
  }
]


