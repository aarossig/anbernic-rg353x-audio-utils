# Set higher priority for internal RK817 audio so PipeWire/WirePlumber
# defaults to the internal speaker/headphones rather than HDMI.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.*"
      }
    ],
    actions = {
      update-props = {
        priority.session = 1500
      }
    }
  }
]
