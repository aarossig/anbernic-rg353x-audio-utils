# WirePlumber configuration for Anbernic RG353 series (RK3566 + RK817)
#
# 1. Label hardware RK817 audio sink as "Headphones".
# 2. Prioritize internal RK817 audio over HDMI output.
# 3. Buffer headroom prevents underruns on low-latency playback.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.*"
      },
      {
        node.name = "~alsa_output.*rk817.*"
      }
    ],
    actions = {
      update-props = {
        node.description = "Headphones"
        priority.session = 1500
        api.alsa.headroom = 1024
      }
    }
  }
]
